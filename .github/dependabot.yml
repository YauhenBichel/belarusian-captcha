version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # One lock file at the root covers every npm workspace (shared/, server/, later widget/, sdk/node/).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  # The Python SDK has no runtime dependencies; this keeps its pinned CI tools (ruff, mypy) and
  # the build backend current. content/ is added when it exists.
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns: ["*"]
