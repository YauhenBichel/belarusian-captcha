version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # One lock file at the root covers every npm workspace (shared/, server/, later widget/, sdk/node/).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  # pip is added when content/ and sdk/python/ exist (phase 1, later pull requests).
