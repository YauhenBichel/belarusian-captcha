name: Release

# Pushing a tag vX.Y.Z (on a commit of main that passed CI) builds the server image for amd64 and
# arm64, smoke-tests it, pushes it to GHCR with provenance and SBOM attestations, and creates the
# GitHub release with the SRI hashes of the widget the image serves (widget-sri.json and the notes).
# See CONTRIBUTING.md, "Cutting a release".

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/yauhenbichel/belarusian-captcha-server

jobs:
  image:
    name: server image (amd64 and arm64, pushed to GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
      widget-sri: ${{ steps.sri.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Check the tag: vMAJOR.MINOR.PATCH, optionally with a pre-release suffix"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not a semver tag"; exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for amd64 and load it locally (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: belarusian-captcha-server:release-test
          provenance: false
          sbom: false
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max
      - name: Smoke test before pushing
        run: scripts/docker-smoke.sh belarusian-captcha-server:release-test
      # The widget is built on the build platform, so the arm64 image carries the same bytes.
      - name: Read the widget's SRI hashes from the image
        id: sri
        run: |
          set -euo pipefail
          id="$(docker create belarusian-captcha-server:release-test)"
          docker cp "$id:/app/widget/dist/sri.json" sri.json
          docker rm "$id" >/dev/null
          echo "json=$(jq -c . sri.json)" >> "$GITHUB_OUTPUT"
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # :X.Y.Z always; :latest only for a release without a pre-release suffix.
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=auto
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for amd64 and arm64 and push, with provenance and SBOM
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          WIDGET_SRI: ${{ needs.image.outputs.widget-sri }}
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease --latest=false)
          printf '%s' "$WIDGET_SRI" | jq . > widget-sri.json
          sri_js="$(jq -er '."widget.js".sri' widget-sri.json)"
          sri_worker="$(jq -er '."widget.worker.js".sri' widget-sri.json)"
          cat > notes.md <<NOTES
          Server image (linux/amd64, linux/arm64), with provenance and SBOM attestations:

              docker pull ${IMAGE}:${VERSION}
              docker pull ${IMAGE}@${DIGEST}

          Run it with the mounts and variables in README.md, "Run with Docker".

          The widget this image serves at /widget.js and /widget.worker.js (all hashes in
          widget-sri.json):

              <script src="https://<your API>/widget.js" async defer
                      integrity="${sri_js}" crossorigin="anonymous"></script>

              widget.worker.js  ${sri_worker}
          NOTES
          gh release create "$TAG" widget-sri.json --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes "$(cat notes.md)" --generate-notes "${prerelease[@]}"
