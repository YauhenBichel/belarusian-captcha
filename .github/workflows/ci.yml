name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: lint, typecheck, test (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (from the lock file only)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Widget build and size budget (25 kB gzipped; the worker 5 kB)
        run: |
          npm run build:widget
          {
            echo '### Widget size'
            echo
            echo '| File | Bytes | Gzipped | Budget |'
            echo '| --- | ---: | ---: | ---: |'
            node -e 'const r=require("./widget/dist/sri.json");for(const[f,v]of Object.entries(r))console.log(`| ${f} | ${v.bytes} | ${v.gzip} | ${v.budget} |`)'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: npm package (packed, then type-checked and imported by a consumer)
        run: npm run check:package

  python:
    name: Python SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the tools (hash-pinned) and the SDK (no dependencies)
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (mypy --strict)
        run: mypy
      - name: Unit tests (the cases shared with the Node SDK included)
        run: python -m unittest discover -s tests -v

  e2e:
    name: "e2e: demo page and verify API (Playwright, Chromium, axe)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (from the lock file only)
        run: npm ci
      - name: Build the server, the widget and the demo
        run: |
          npm run build
          npm run build:demo
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Upload the Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 7

  image:
    name: server image (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (not pushed)
        run: docker build --pull -t belarusian-captcha-server:ci .
      - name: Smoke test (health, metrics, SIGTERM drain and exit code)
        run: scripts/docker-smoke.sh belarusian-captcha-server:ci
      - name: Image size
        run: docker image ls belarusian-captcha-server:ci

  pinned-actions:
    name: actions pinned by commit SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every third-party action is pinned to a full commit SHA
        shell: bash
        run: |
          set -euo pipefail
          bad=$(grep -RhoE '^\s*-?\s*uses:\s*[^ #]+' .github/workflows \
            | sed -E 's/^\s*-?\s*uses:\s*//' \
            | grep -vE '^\./' \
            | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$bad" ]; then
            echo "::error::actions not pinned by SHA:"; echo "$bad"; exit 1
          fi
          echo "all actions pinned"
