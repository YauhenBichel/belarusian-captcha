[project]
name = "belarusian-captcha-content"
version = "0.0.0"
description = "Offline content pipeline of belarusian-captcha: check proverb items, build the pack."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml"]
optional-dependencies = { verse = ["belarusian-verse[spelling]"] }
classifiers = ["Private :: Do Not Upload"]

# Not installed: run with PYTHONPATH=src (see README.md). Dependencies are pinned with hashes in
# requirements.txt (runtime), requirements-dev.txt (checks) and requirements-verse.txt
# (the optional spelling and stress report).

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Look-alike letters are the point of the normaliser and of the Cyrillic test strings.
"src/bc_content/normalise.py" = ["RUF001", "RUF003"]
"tests/**" = ["S", "RUF001"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"

# belarusian-verse is optional and untyped; the report treats it as Any.
[[tool.mypy.overrides]]
module = ["belarusian_verse"]
ignore_missing_imports = true
