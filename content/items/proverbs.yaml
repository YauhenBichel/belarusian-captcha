#     source: { work: "…", page: "…", licence: public-domain }
#     difficulty: easy               # easy | normal | hard
#     tags: [everyday]
#     review:
#       - { reviewer: handle-a, verdict: ok, date: 2026-12-01 }   # ok | changes | reject
#       - { reviewer: handle-b, verdict: ok, date: 2026-12-02 }
#     status: draft                  # draft -> reviewed -> live -> retired
#     allow_flagged: []              # stop-list stems a reviewer checked and accepted
